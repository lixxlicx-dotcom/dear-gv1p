<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050000">
<title>Dear GV1P</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:#050505;color:white;
 font-family:Arial,sans-serif;overflow-x:hidden;
}
body:before{
 content:"";position:fixed;inset:0;
 background:radial-gradient(circle at 50% 20%,#350000 0%,transparent 55%),linear-gradient(#080000,#000);
 z-index:-2;
}
body:after{
 content:"";position:fixed;top:0;left:0;right:0;height:14px;
 background:linear-gradient(180deg,#4a0000 0%,#9e0000 65%,transparent 100%);
 box-shadow:0 4px 18px #7a0000aa;
 z-index:3;pointer-events:none;
}

/* HALAMAN 1: LAYAR PEMBUKA MULUT GIGI EMAS GV1P & SIDIK JARI */
#introMouthScreen{
 position:fixed;inset:0;z-index:9999;
 background:radial-gradient(circle at 50% 42%, #240000 0%, #050000 80%);
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 transition:opacity 0.9s ease, transform 0.9s ease;
 padding:20px;
}
#introMouthScreen.unlock{
 opacity:0;
 transform:scale(1.15);
 pointer-events:none;
}

.mouth-wrapper{
 width:340px;max-width:94vw;
 filter:drop-shadow(0 0 28px rgba(255, 0, 0, 0.5));
 animation:mouthFloat 3s ease-in-out infinite;
}
@keyframes mouthFloat{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-6px)}
}

/* ANIMASI TANGAN & BIBIR BUKA TUTUP 5X LALU BERHENTI TERBUKA */
.upper-pull{
 animation:pullUpper 0.8s ease-in-out 5 forwards;
 transform-origin:center;
}
.lower-pull{
 animation:pullLower 0.8s ease-in-out 5 forwards;
 transform-origin:center;
}
@keyframes pullUpper{
 0%{transform:translateY(14px)}
 50%{transform:translateY(-10px)}
 100%{transform:translateY(-10px)}
}
@keyframes pullLower{
 0%{transform:translateY(-14px)}
 50%{transform:translateY(12px)}
 100%{transform:translateY(12px)}
}

.gold-shine{
 animation:shinePulse 2s infinite alternate;
}
@keyframes shinePulse{
 from{filter:brightness(1)}
 to{filter:brightness(1.35) drop-shadow(0 0 6px #ffd700)}
}

.fingerprint-area{
 margin-top:28px;
 display:flex;flex-direction:column;
 align-items:center;cursor:pointer;
 -webkit-tap-highlight-color:transparent;
}
.fp-ring{
 width:86px;height:86px;border-radius:50%;
 border:2px solid #b30000;
 background:radial-gradient(circle, #2b0000 0%, #0a0000 75%);
 display:grid;place-items:center;
 position:relative;
 box-shadow:0 0 20px #ff000066, inset 0 0 15px #ff000044;
 transition:all 0.3s ease;
 animation:fpPulse 1.8s infinite;
}
@keyframes fpPulse{
 0%,100%{box-shadow:0 0 15px #ff000055, inset 0 0 10px #ff000033;transform:scale(1)}
 50%{box-shadow:0 0 30px #ff1a1acc, inset 0 0 20px #ff1a1a77;transform:scale(1.05)}
}
.fp-ring.scanning{
 border-color:#ffd700;
 box-shadow:0 0 35px #ffd700cc, inset 0 0 25px #ffd70088;
 transform:scale(0.94);
}
.fp-icon{
 width:46px;height:46px;stroke:#ff2a2a;
 transition:stroke 0.3s ease;
}
.fp-ring.scanning .fp-icon{
 stroke:#ffd700;
}
.scan-line{
 position:absolute;left:12px;right:12px;height:2px;
 background:#ff3333;box-shadow:0 0 8px #ff0000;
 top:20%;opacity:0.85;
 animation:laserScan 1.6s ease-in-out infinite;
}
@keyframes laserScan{
 0%,100%{top:20%}
 50%{top:78%}
}
.fp-text{
 margin-top:14px;color:#ccc;
 font-size:11px;letter-spacing:3px;
 text-transform:uppercase;
 animation:blinkText 1.6s infinite;
}
@keyframes blinkText{
 0%,100%{opacity:0.5}
 50%{opacity:1}
}

/* HALAMAN 2: KONTEN UTAMA DEAR GV1P */
header{
 text-align:center;padding:65px 15px 35px;
 animation:bounceIn 1s ease-out;
}
h1{color:#e00000;font-size:clamp(35px,8vw,55px);letter-spacing:5px;text-shadow:0 0 15px red,0 0 35px #700}
.subtitle{color:#aaa;letter-spacing:2px;font-size:12px}

@keyframes bounceIn{
 0%{opacity:0;transform:translateY(80px) scale(0.88)}
 55%{opacity:1;transform:translateY(-18px) scale(1.03)}
 75%{transform:translateY(8px) scale(0.99)}
 90%{transform:translateY(-4px) scale(1.01)}
 100%{opacity:1;transform:translateY(0) scale(1)}
}

section{
 width:92%;max-width:600px;margin:22px auto;padding:22px;
 background:#100909;border:1px solid #650000;
 border-radius:18px;box-shadow:0 0 20px #50000044;
 position:relative;z-index:2;
 opacity:0;
}
section.show{
 animation:bounceIn 0.95s ease-out forwards;
}

h2{color:#e00000;font-size:20px}
p{color:#ccc;line-height:1.6}
button{
 background:#a00000;color:white;border:1px solid #e00000;
 padding:12px 20px;border-radius:10px;cursor:pointer;
 margin:5px;font-weight:bold;
}
button:active{transform:scale(.96)}
.center{text-align:center}

.turntable{
 background:linear-gradient(145deg,#303030,#090909);
 padding:20px;border:3px solid #555;
 border-radius:22px;box-shadow:0 12px 30px #000;
}
.lid{
 background:linear-gradient(135deg,#ffffff20,#ffffff03);
 border:3px solid #888;border-radius:16px;
 padding:20px;box-shadow:inset 0 0 30px #aaa4;
}
.deck{
 width:190px;height:190px;margin:auto;border-radius:50%;
 background:repeating-radial-gradient(circle,#111 0 4px,#333 5px 6px);
 border:8px solid #444;display:grid;place-items:center;
 position:relative;animation:spin 5s linear infinite;
 animation-play-state:paused;
}
.deck.playing{animation-play-state:running}
.deck img{
 width:85px;height:85px;object-fit:cover;
 border-radius:50%;border:4px solid #a00000;
 image-orientation:from-image;
}
.arm{
 position:absolute;width:85px;height:7px;background:#aaa;
 right:-8px;top:40px;transform:rotate(45deg);
 border-radius:10px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.gallery{
 display:flex;justify-content:center;
}
.gallery img{
 width:100%;max-width:340px;height:360px;object-fit:cover;
 border-radius:14px;border:1px solid #900;
 image-orientation:from-image;
}

.gifs{
 display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}
.gif{
 overflow:hidden;border-radius:13px;
 background:#200909;border:1px solid #800;
}
.gif img{
 width:100%;height:160px;object-fit:cover;
 display:block;animation:wiggle 1.5s infinite;
}
@keyframes wiggle{
 0%,100%{transform:rotate(-2deg)}
 50%{transform:rotate(2deg) scale(1.03)}
}

#message{white-space:pre-wrap;line-height:1.9;color:#eee;font-size:15px}

.money{
 position:fixed;top:-80px;z-index:1;
 pointer-events:none;font-size:30px;
 animation:fall linear forwards;
}
@keyframes fall{
 to{transform:translateY(115vh) rotate(800deg);opacity:0}
}

.blood{
 position:fixed;top:-10px;z-index:3;pointer-events:none;
 width:var(--width);height:var(--height);left:var(--left);
 background:radial-gradient(circle at 35% 88%, #ff2a2a 0%, #a30000 35%, #4d0000 85%, #2b0000 100%);
 border-radius:40% 40% 50% 50% / 15% 15% 85% 85%;
 box-shadow:inset -2px -3px 6px #2a0000, inset 2px 2px 4px #ff666655, 0 4px 10px #660000aa;
 filter:blur(0.3px);
 animation:realisticDrip var(--speed) cubic-bezier(0.55, 0.05, 0.85, 0.35) forwards;
}
.blood::after{
 content:"";position:absolute;bottom:14%;left:26%;
 width:28%;height:18%;border-radius:50%;
 background:rgba(255,180,180,0.45);
}
@keyframes realisticDrip{
 0%{transform:scaleY(0.15) scaleX(1.3);transform-origin:top;opacity:0.95}
 35%{transform:scaleY(1.15) scaleX(0.95);transform-origin:top;opacity:1}
 60%{transform:translateY(15vh) scaleY(1) scaleX(1);opacity:1}
 100%{transform:translateY(108vh) scaleY(1.3) scaleX(0.85);opacity:0}
}

.footer{
 text-align:center;padding:35px;color:#777;
 font-size:12px;letter-spacing:3px;
}
@media(max-width:400px){
 .deck{width:165px;height:165px}
 section{padding:17px}
}
</style>
</head>
